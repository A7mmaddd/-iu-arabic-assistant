<!DOCTYPE html>
<html lang="en" dir="ltr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#12503f">
<title>IU Arabic Courses Assistant</title>
<style>
:root{
  color-scheme:light;
  --bg:#f6f0e4;--panel:#fffdf7;--panel2:#fbf5e6;--ink:#2b2a22;--mut:#7a735c;--line:#e4d8bd;
  --brand:#12503f;--brand2:#1d7a60;--brand-ink:#12503f;--soft:#f3ead0;--ring:rgba(201,162,75,.42);
  --gold:#c9a24b;--hd:#12503f;
  --ok:#17803f;--okbg:#e6f5ec;--bad:#b3261e;--badbg:#fdecea;
  --r:12px;--r-sm:9px;
  --sh1:0 1px 2px rgba(60,48,18,.08),0 1px 1px rgba(60,48,18,.05);
  --sh2:0 16px 34px -16px rgba(60,48,18,.35),0 3px 8px rgba(60,48,18,.06);
  --grad:linear-gradient(135deg,#12503f 0%,#1d7a60 100%);
  --font:"IBM Plex Sans Arabic","Segoe UI","Noto Sans Arabic",Tahoma,system-ui,-apple-system,sans-serif;
  --serif:Georgia,"Noto Naskh Arabic","Times New Roman",serif;
  --ease:cubic-bezier(.22,.8,.3,1);
}
[data-theme=dark]{
  color-scheme:dark;
  --bg:#0d1612;--panel:#15211b;--panel2:#1a2922;--ink:#ece6d4;--mut:#a39d84;--line:#2a3a31;
  --brand:#5cc79c;--brand2:#3ea67f;--brand-ink:#8be0bd;--soft:#1b3329;--ring:rgba(212,174,90,.4);
  --gold:#d4ae5a;--hd:#0c2a22;
  --ok:#5ccd8e;--okbg:#122e1e;--bad:#f28b82;--badbg:#3a1a17;
  --sh1:0 1px 2px rgba(0,0,0,.4);--sh2:0 16px 36px -14px rgba(0,0,0,.7);
  --grad:linear-gradient(135deg,#12503f 0%,#1d7a60 100%);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 var(--font);-webkit-font-smoothing:antialiased;
  transition:background .3s var(--ease),color .3s var(--ease)}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hide{display:none!important}.mut{color:var(--mut)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.boot #login{visibility:hidden}

/* ---------- buttons ---------- */
button{cursor:pointer;border:0;border-radius:var(--r-sm);padding:10px 18px;background:var(--grad);color:#fff;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 2px 8px -2px rgba(18,80,63,.45);
  transition:transform .18s var(--ease),box-shadow .2s,background .2s,opacity .2s,border-color .2s}
button:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 8px 16px -6px rgba(18,80,63,.55)}
button:active:not(:disabled){transform:translateY(0) scale(.98)}
button.ghost{background:transparent;color:var(--brand);border:1px solid var(--line);box-shadow:none}
button.ghost:hover:not(:disabled){background:var(--soft);border-color:var(--brand);box-shadow:none}
button.danger{color:var(--bad)}
button.danger:hover:not(:disabled){background:var(--badbg);border-color:var(--bad)}
button.icon{padding:0;width:38px;height:38px;border-radius:12px;gap:6px}
button.icon.wide{width:auto;padding:0 12px;font-size:13px}
button:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}

/* ---------- inputs ---------- */
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 14px;
  transition:border-color .2s,box-shadow .2s,background .2s}
input:hover,select:hover,textarea:hover{border-color:var(--mut)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 4px var(--ring)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
input[type=number]{text-align:center;-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button{opacity:.5}

/* ---------- login ---------- */
.login{min-height:100%;display:grid;grid-template-columns:1.05fr 1fr}
.hero{position:relative;overflow:hidden;color:#fff;background:var(--grad);padding:56px 52px;display:flex;flex-direction:column;justify-content:center;gap:28px}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(201,162,75,.16)}
.hero::before{width:420px;height:420px;inset-block-start:-140px;inset-inline-end:-120px}
.hero::after{width:300px;height:300px;inset-block-end:-110px;inset-inline-start:-80px}
.hero>*{position:relative;z-index:1}
.hero .logo{background:rgba(255,255,255,.18);box-shadow:none;backdrop-filter:blur(6px)}
.hero h1{margin:0;font:700 34px/1.25 var(--serif);line-height:1.25;letter-spacing:-.01em}
.hero p{margin:0;font-size:16px;opacity:.92;max-width:430px}
.feats{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.feats li{display:flex;align-items:center;gap:12px;font-weight:600}
.feats .fi{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.16);display:grid;place-items:center}
.formside{display:grid;place-items:center;padding:28px;position:relative}
.formside .corner{position:absolute;inset-block-start:16px;inset-inline-end:16px;display:flex;gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:34px 32px;width:100%;max-width:420px;box-shadow:var(--sh2);animation:rise .5s var(--ease)}
.card h2{margin:0 0 4px;font:700 24px var(--serif);color:var(--brand-ink)}
.card label.f{display:block;margin:16px 0 6px;font-weight:600;font-size:13px;color:var(--mut)}
.card input[type=text],.card input[type=email]{width:100%}
.card .go{width:100%;margin-top:22px;padding:13px}
.card .note{font-size:12px;margin:16px 0 0;text-align:center}
.logo{width:54px;height:54px;border-radius:16px;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 10px 22px -8px rgba(18,80,63,.6)}
.logo svg{width:28px;height:28px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:4px}
.seg label{margin:0;cursor:pointer;text-align:center;padding:9px;border-radius:10px;font-weight:600;font-size:14px;color:var(--mut);transition:.2s;display:flex;gap:7px;align-items:center;justify-content:center}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--panel);color:var(--brand-ink);box-shadow:var(--sh1),inset 0 0 0 1px var(--brand)}
.seg label:has(input:focus-visible){outline:2px solid var(--brand)}
.spin{width:16px;height:16px;border-radius:50%;border:2.5px solid color-mix(in srgb,currentColor 25%,transparent);border-top-color:currentColor;animation:spin .75s linear infinite;flex:none;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:304px 1fr;grid-template-rows:minmax(0,1fr);height:100vh;height:100dvh}
aside{background:var(--panel);border-inline-end:1px solid var(--line);padding:18px 16px;display:flex;flex-direction:column;gap:14px;overflow:auto;position:relative;z-index:30;
  transition:transform .3s var(--ease)}
aside.dragging::after{content:attr(data-drop);position:absolute;inset:8px;border:2px dashed var(--brand);border-radius:var(--r);background:color-mix(in srgb,var(--soft) 92%,transparent);
  display:grid;place-items:center;color:var(--brand-ink);font-weight:700;z-index:5;text-align:center;padding:12px}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:15px;line-height:1.3}
.ulogo{height:46px;max-width:150px;object-fit:contain;background:#fff;border-radius:10px;padding:4px 8px;flex:none}
.hero .ulogo{height:56px;max-width:230px;align-self:flex-start}
.brand small{display:block;font-weight:400;color:var(--mut);font-size:11.5px;line-height:1.4}
.brand .logo{width:40px;height:40px;border-radius:12px;box-shadow:none}
.brand .logo svg{width:22px;height:22px}
.brand>span{flex:1}
.user{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 8px 8px 10px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--grad);box-shadow:0 0 0 2px var(--gold);color:#fff;display:grid;place-items:center;font-weight:700;flex:none;text-transform:uppercase}
.user .meta{min-width:0;flex:1;line-height:1.3}
.user .meta b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.user .meta small{color:var(--mut);font-size:12px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tools button{padding:8px 10px;font-size:13px}
.upload{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;border:2px dashed var(--gold);
  border-radius:var(--r);padding:18px 12px;color:var(--brand-ink);font-weight:600;cursor:pointer;background:var(--soft);transition:.25s var(--ease)}
.upload:hover{background:var(--panel2);box-shadow:0 0 0 4px var(--ring)}
.upload.busy{pointer-events:none;opacity:.85}
.upload.pulse{animation:pulse .7s 2}
@keyframes pulse{50%{box-shadow:0 0 0 8px var(--ring)}}
.upload svg{width:26px;height:26px}
.upload small{font-weight:400;color:var(--mut);font-size:12px;line-height:1.5}
.side-title{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;color:var(--mut);letter-spacing:.04em;text-transform:uppercase;margin:4px 4px -4px}
.side-title .badge{text-transform:none;letter-spacing:0}
.files{display:flex;flex-direction:column;gap:8px}
.file{text-align:start;background:var(--panel);color:var(--ink);border:1px solid var(--line);font-weight:600;padding:10px 12px;
  border-radius:var(--r-sm);box-shadow:none;width:100%;position:relative;justify-content:flex-start;gap:12px}
.file:hover:not(:disabled){background:var(--panel2);transform:none;box-shadow:none;border-color:var(--mut)}
.file .tx{min-width:0;flex:1}
.file .tx b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.file .tx small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.file.on{border-color:var(--brand);background:var(--soft);box-shadow:inset 4px 0 0 var(--brand)}
.ext{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:10.5px;font-weight:800;letter-spacing:.03em;flex:none;color:#fff;background:#d8493b}
.ext.ppt,.ext.pptx{background:#e07a1f}
.ext.other{background:var(--mut)}
.scrim{position:fixed;inset:0;background:rgba(5,15,20,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}

/* ---------- workspace ---------- */
.work{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%}
.top{padding:16px 28px;background:var(--hd);color:#f6f0e4;border-bottom:4px solid var(--gold);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center}
.top .ttl{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 240px}
.top h2{margin:0;font:700 20px/1.4 var(--serif);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu{display:none}
.range{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#f6f0e4!important;border-radius:99px;padding:4px 6px 4px 14px;font-size:13px;gap:8px;flex-wrap:nowrap}
.range button{color:#f6f0e4;border-color:rgba(255,255,255,.4)}
.range button:hover:not(:disabled){background:rgba(255,255,255,.15)!important;border-color:#f6f0e4!important}
.top .menu{color:#f6f0e4;border-color:rgba(255,255,255,.35)}
.range input{width:62px;padding:5px 6px;border-radius:99px;color:var(--ink);background:var(--panel);border-color:transparent}
.range button{padding:5px 12px;font-size:12px;border-radius:99px}
.range .of{white-space:nowrap}
nav{display:flex;gap:24px;padding:0 28px;background:var(--panel2);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:transparent;color:var(--mut);border-radius:0;padding:14px 2px 11px;white-space:nowrap;box-shadow:none;font-weight:600;border-bottom:3px solid transparent}
nav button *{pointer-events:none}
nav button:hover:not(:disabled){background:transparent;color:var(--ink);transform:none;box-shadow:none}
nav button.on{background:transparent;color:var(--brand-ink);border-bottom-color:var(--gold);box-shadow:none}
.panels{flex:1;overflow:auto;padding:26px 28px 0;scroll-behavior:smooth}
.panel{max-width:880px;padding-bottom:28px;animation:fade .3s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.panel>p.hint{margin:0 0 16px;font-size:14px;color:var(--mut);padding-inline-start:12px;border-inline-start:3px solid var(--gold)}
.banner{max-width:880px;display:flex;align-items:center;gap:12px;background:var(--soft);color:var(--brand-ink);border:1px solid color-mix(in srgb,var(--brand) 35%,transparent);
  padding:12px 16px;border-radius:var(--r-sm);margin-bottom:18px;font-size:14px;font-weight:600}

/* ---------- outputs ---------- */
.out{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-top:18px;box-shadow:var(--sh1);animation:rise .4s var(--ease);overflow:hidden}
.oh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px 10px 20px;border-bottom:1px solid var(--line);background:var(--panel2)}
.oh b{font:700 14px var(--serif);color:var(--brand-ink)}
.oh button{padding:6px 12px;font-size:13px}
.ob{padding:18px 24px;line-height:1.95}
.out ul{margin:0;padding-inline-start:22px}.out li{margin:8px 0}.out li::marker{color:var(--gold)}
.rich p{margin:0 0 .6em}.rich p:last-child{margin:0}.rich ul{margin:.3em 0 .6em}
.plain{white-space:pre-wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px dashed var(--line)}
.chip{background:var(--brand);color:#f6f0e4;border-radius:6px;padding:2px 14px;font-size:13px;font-weight:600}
[data-theme=dark] .chip{color:#0d1612}
.badge{background:var(--soft);color:var(--brand-ink);border-radius:99px;padding:2px 12px;font-size:12.5px;font-weight:700}
.empty{color:var(--mut);padding:26px;text-align:center;border:1.5px dashed var(--line);border-radius:var(--r);margin-top:18px;background:var(--panel2);font-size:14px}
.files .empty{margin-top:0;padding:18px;font-size:13px}
.skel{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px 24px;display:grid;gap:12px}
.skel .sm{display:flex;align-items:center;gap:12px;color:var(--mut);font-size:14px}
.skel i{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--line) 25%,var(--panel2) 50%,var(--line) 75%);background-size:200% 100%;animation:shine 1.3s linear infinite}
.skel i.s{width:60%}
@keyframes shine{to{background-position:-200% 0}}
.err span{white-space:pre-wrap;word-break:break-word}
.err{background:var(--badbg);color:var(--bad);border-radius:var(--r-sm);padding:11px 16px;margin-top:14px;border:1px solid color-mix(in srgb,var(--bad) 25%,transparent);font-size:14px;display:flex;gap:10px;align-items:flex-start;animation:rise .3s var(--ease)}
.err svg{margin-top:3px}

/* ---------- tutor ---------- */
.chat{display:flex;flex-direction:column;gap:14px;margin:0 0 16px}
.mrow{display:flex;gap:10px;align-items:flex-end;animation:rise .3s var(--ease)}
.mrow.me{flex-direction:row-reverse}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:13px;font-weight:700;color:#fff;background:var(--grad)}
.mrow.ai .av{background:var(--soft);color:var(--brand-ink);border:1px solid var(--line)}
.msg{max-width:min(85%,640px);padding:11px 16px;border-radius:18px;line-height:1.85;box-shadow:var(--sh1)}
.mrow.me .msg{background:var(--grad);color:#fff;border-end-end-radius:5px;white-space:pre-wrap}
.mrow.ai .msg{background:var(--panel);border:1px solid var(--line);border-end-start-radius:5px}
.dots{display:inline-flex;gap:5px;padding:6px 2px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--mut);animation:bounce 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
.tuempty{text-align:center;padding:26px 10px 10px;color:var(--mut)}
.tuempty .logo{margin:0 auto 12px;width:46px;height:46px;border-radius:14px}
.tuempty b{display:block;color:var(--ink);font-size:16px;margin-bottom:12px}
.sugs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.sugs button{background:var(--panel);color:var(--brand-ink);border:1px solid var(--line);box-shadow:none;font-weight:600;font-size:13.5px;padding:8px 14px;border-radius:99px}
.sugs button:hover:not(:disabled){background:var(--soft);border-color:var(--brand);box-shadow:none}
.ask{display:flex;gap:10px;position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 22%);padding:16px 0 4px}
.ask input{flex:1;min-width:0;border-radius:99px;padding:12px 20px;box-shadow:var(--sh1)}
.ask button{flex:none}
.ask button{border-radius:99px;padding-inline:22px}

/* ---------- quiz / exam ---------- */
.q{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px 24px;margin-top:16px;box-shadow:var(--sh1);animation:rise .35s var(--ease) both}
.q h4{margin:0 0 12px;font-size:16px;line-height:1.7;display:flex;gap:12px}
.q h4 .n{flex:none;width:28px;height:28px;border-radius:9px;background:var(--soft);color:var(--brand-ink);display:grid;place-items:center;font-size:13px;margin-top:2px}
.opt{display:flex;gap:12px;align-items:center;padding:11px 14px;border:1px solid var(--line);border-radius:var(--r-sm);margin:8px 0;cursor:pointer;transition:.18s;position:relative}
.opt:hover{background:var(--panel2);border-color:var(--mut)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .k{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--mut);flex:none;transition:.18s}
.opt:has(input:checked){border-color:var(--brand);background:var(--soft)}
.opt:has(input:checked) .k{background:var(--brand);border-color:var(--brand);color:#fff}
.opt:has(input:focus-visible){outline:2px solid var(--brand);outline-offset:2px}
.opt.lock.right{border-color:var(--ok);background:var(--okbg)}.opt.lock.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.lock.wrong{border-color:var(--bad);background:var(--badbg)}.opt.lock.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.lock{cursor:default}
.why{margin-top:10px;font-size:14px;color:var(--mut)}
.qbar{position:sticky;bottom:0;margin-top:18px;padding:16px 0 4px;background:linear-gradient(transparent,var(--bg) 25%);display:flex;align-items:center;gap:14px}
.qbar .pw{flex:1;display:grid;gap:4px;font-size:13px;color:var(--mut)}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--grad);border-radius:99px;transition:width .35s var(--ease)}
.result{display:flex;align-items:center;gap:22px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 24px;margin-top:18px;box-shadow:var(--sh1);animation:rise .4s var(--ease)}
.ring{width:84px;height:84px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.ring .bg{stroke:var(--line)}.ring .fg{stroke:var(--brand);stroke-dasharray:213.6;stroke-dashoffset:213.6;transition:stroke-dashoffset 1s var(--ease)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:17px}
.result .rt{flex:1}.result .rt b{display:block;font-size:20px}.result .rt span{color:var(--mut);font-size:14px}
.q textarea{width:100%;resize:vertical}
.q .qh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.exhead{display:flex;justify-content:flex-end;margin-top:14px}
.eopts{display:grid;gap:6px;margin:12px 0}
.eo{display:flex;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r-sm);font-size:14px}
.eo.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:600}
.eo .k{width:22px;height:22px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--mut);flex:none}
.eo.ok .k{background:var(--ok);color:#fff}

/* ---------- exam publishing ---------- */
.codein{width:200px;text-align:center;font:700 20px/1.2 ui-monospace,Consolas,monospace;letter-spacing:.2em;text-transform:uppercase;padding:11px 14px}
.badge.draft{background:var(--panel2);color:var(--mut);border:1px solid var(--line)}

.pubbox{margin-top:16px;background:var(--soft);border:1px solid var(--gold);border-radius:var(--r);padding:18px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;animation:rise .4s var(--ease)}
.pubbox .code{font:800 34px/1.1 ui-monospace,Consolas,monospace;letter-spacing:.22em;color:var(--brand-ink);direction:ltr}
.pubbox .tx{flex:1;min-width:180px;color:var(--mut);font-size:14px}.pubbox .tx b{display:block;color:var(--ink);font-size:15px}
.ro{padding:10px 14px;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:6px;white-space:pre-wrap;line-height:1.8}
.tblw{overflow-x:auto}.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:10px 16px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em;background:var(--panel2)}
.tbl tr:last-child td{border-bottom:0}
.pct{font-weight:700}.pct.hi{color:var(--ok)}.pct.lo{color:var(--bad)}

/* ---------- toasts ---------- */
#toasts{position:fixed;inset-block-end:20px;inset-inline:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:100;pointer-events:none;padding:0 16px}
.toast{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:var(--sh2);
  max-width:min(520px,100%);opacity:0;transform:translateY(12px) scale(.97);transition:.25s var(--ease)}
.toast.in{opacity:1;transform:none}
.toast.ok svg{color:#4ade80}.toast.err svg{color:#fb7185}

/* ---------- responsive ---------- */
@media(max-width:900px){
  .login{grid-template-columns:1fr}
  .hero{padding:30px 24px;gap:16px}.hero h1{font-size:26px}.feats{display:none}
}
@media(max-width:820px){
  .shell{grid-template-columns:1fr}
  aside{position:fixed;inset-block:0;inset-inline-start:0;width:min(320px,86vw);transform:translateX(-102%);box-shadow:var(--sh2)}
  [dir=rtl] aside{transform:translateX(102%)}
  .drawer aside{transform:none}
  .drawer .scrim{opacity:1;pointer-events:auto}
  .menu{display:inline-flex}
  .top{padding:12px 14px}.range{order:3;width:100%;justify-content:center}
  nav{padding:0 14px;gap:18px}.panels{padding:18px 14px 0}
  .ob{padding:16px 18px}.result{flex-direction:column;text-align:center}
  .qbar{flex-wrap:wrap}.qbar button{flex:1}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

let L=store.get('lang')||((navigator.language||'').toLowerCase().startsWith('ar')?'ar':'en');
const t=(k,...a)=>{const v=T[L][k]??T.en[k];return typeof v==='function'?v(...a):v};

/* ---------- state ---------- */
const S={user:null,files:[],fid:null,last:undefined,sid:null,quiz:null,exam:null,exams:[],take:null,tab:'sum',busyAsk:false};
const cur=()=>S.files.find(f=>f.id===S.fid);

/* ---------- api ---------- */
const api=async(u,m='GET',b)=>{const fd=b instanceof FormData;
  let r;try{r=await fetch(u,{method:m,headers:fd?{}:{'Content-Type':'application/json'},body:fd?b:b&&JSON.stringify(b)})}catch{throw t('netErr')}
  let d;const raw=await r.text();
  try{d=JSON.parse(raw)}catch{
    const m=raw.match(/<title>([\s\S]*?)<\/title>/i);let msg='';
    if(m){const x=document.createElement('textarea');x.innerHTML=m[1];msg=x.value.replace(/\s*\/\/\s*Werkzeug.*$/i,'').trim().slice(0,400)}
    throw t('srvErr')+(msg?'\n'+msg:'')}
  if(!r.ok)throw d.error||t('generic');return d};

/* ---------- ui bits ---------- */
const note=m=>h('div',{class:'empty'},m);
const fail=m=>h('div',{class:'err',role:'alert'},ic('alert'),h('span',{},String(m)));
const skel=m=>h('div',{class:'skel'},h('div',{class:'sm'},h('span',{class:'spin'}),m),h('i'),h('i'),h('i',{class:'s'}));
const run=async(out,msg,fn,btn)=>{if(btn)btn.disabled=true;put(out,skel(msg));
  try{await fn()}catch(x){put(out,fail(x))}finally{if(btn)btn.disabled=false}};
function toast(msg,type='info',ms){ms=ms||(type==='err'?5500:2600);
  const el=h('div',{class:'toast '+type,role:'status'},ic(type==='err'?'alert':type==='ok'?'check':'spark'),h('span',{},String(msg)));
  $('#toasts').append(el);requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('in')));
  setTimeout(()=>{el.classList.remove('in');setTimeout(()=>el.remove(),300)},ms)}
function copyBtn(getText){const b=h('button',{class:'ghost',type:'button'},ic('copy'),t('copy'));
  b.onclick=async()=>{try{await navigator.clipboard.writeText(getText());toast(t('copied'),'ok')}catch{
    const ta=h('textarea',{style:'position:fixed;opacity:0'});ta.value=getText();document.body.append(ta);ta.select();
    try{document.execCommand('copy');toast(t('copied'),'ok')}catch{}ta.remove()}};return b}
function card(title,body,copyText){return h('div',{class:'out'},h('div',{class:'oh'},h('b',{},title),copyText!=null?copyBtn(()=>copyText):''),h('div',{class:'ob',dir:'auto'},body))}
const inline=s=>String(s).split(/(\*\*[^*]+\*\*)/g).filter(Boolean).map(p=>/^\*\*[^*]+\*\*$/.test(p)?h('strong',{},p.slice(2,-2)):p);
function rich(text){const box=h('div',{class:'rich'});let ul=null;
  String(text).split('\n').forEach(line=>{const m=line.match(/^\s*[-*•]\s+(.*)/);
    if(m){if(!ul){ul=h('ul');box.append(ul)}ul.append(h('li',{dir:'auto'},...inline(m[1])))}
    else{ul=null;if(line.trim())box.append(h('p',{dir:'auto'},...inline(line)))}});return box}
const ready=()=>{if(S.fid)return true;toast(t('needFile'),'err');
  const z=$('#upzone');z.classList.remove('pulse');void z.offsetWidth;z.classList.add('pulse');openDrawer();return false};

/* ---------- theme & language ---------- */
let theme=store.get('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
function applyTheme(){document.documentElement.dataset.theme=theme;
  $('meta[name=theme-color]').content=theme==='dark'?'#0c2a22':'#12503f';
  $$('.js-theme').forEach(b=>b.replaceChildren(ic(theme==='dark'?'sun':'moon')))}
function applyLang(){document.documentElement.lang=L;document.documentElement.dir=L==='ar'?'rtl':'ltr';
  $$('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));
  $$('[data-i18n-ph]').forEach(e=>e.placeholder=t(e.dataset.i18nPh));
  $$('[data-i18n-title]').forEach(e=>{const v=t(e.dataset.i18nTitle);e.title=v;e.setAttribute('aria-label',v)});
  $$('.js-lang').forEach(b=>b.replaceChildren(ic('globe'),h('span',{},L==='ar'?'EN':'عربي')));
  $('#side').dataset.drop=t('dropHere');
  if(S.user)setWho();drawFiles();pick(S.fid);drawTutorEmpty();updatePc();
  drawExamList();
  if(S.exam&&(S.exam.questions.length||S.exam.published)){const tx=$$('#o-ex textarea').map(x=>x.value);drawExam();$$('#o-ex textarea').forEach((x,i)=>{if(tx[i]!==undefined&&tx[i]!==x.value){x.value=tx[i];x.dispatchEvent(new Event('input'))}})}}
document.addEventListener('click',e=>{
  if(e.target.closest('.js-theme')){theme=theme==='dark'?'light':'dark';store.set('theme',theme);applyTheme()}
  if(e.target.closest('.js-lang')){L=L==='ar'?'en':'ar';store.set('lang',L);applyLang()}});

/* ---------- files ---------- */
async function loadFiles(sel){S.files=await api('/api/files');
  if(sel)S.fid=sel;else if(!S.files.find(f=>f.id===S.fid))S.fid=S.files[0]?.id||null;pick(S.fid)}
function drawFiles(){$('#fcount').textContent=S.files.length;
  put('#files',...(S.files.length?S.files.map(f=>{const ex=(f.name.split('.').pop()||'').toLowerCase();
    return h('button',{class:'file'+(f.id===S.fid?' on':''),type:'button',onclick:()=>{pick(f.id);closeDrawer()}},
      h('span',{class:'ext '+(['pdf','ppt','pptx'].includes(ex)?ex:'other')},ex.slice(0,4)||'?'),
      h('span',{class:'tx'},h('b',{dir:'auto'},f.name),h('small',{},t('pagesN',f.pages))))}):[note(t('noFiles'))]))}
function resetOutputs(){S.sid=null;S.quiz=null;$('#btrs').disabled=true;
  ['#o-sum','#o-sum2','#o-tr','#o-qz','#chat'].forEach(i=>put(i));drawTutorEmpty()}
function pick(id){S.fid=id;const f=cur();
  if(S.last!==undefined&&S.last!==id)resetOutputs();S.last=id;
  setTitle();
  updateBanner();
  if(f){const m=Math.max(1,f.pages);$('#a').max=$('#b').max=m;
    if(!$('#a').dataset.f||$('#a').dataset.f!==f.id){$('#a').value=1;$('#b').value=m;$('#a').dataset.f=f.id}
    $('#of').textContent=t('of',f.pages)}else $('#of').textContent='';
  drawFiles()}
function setTitle(){const f=cur();$('#fname').textContent=S.tab==='te'?t('tTe'):(f?f.name:t('noFileSel'))}
function updateBanner(){$('#nofile').classList.toggle('hide',!!cur()||S.tab==='te');
  $('.range').classList.toggle('hide',S.tab==='te');setTitle()}
function rng(){const f=cur(),max=Math.max(1,f?f.pages:1);
  let a=Math.max(1,Math.min(max,Math.round(+$('#a').value)||1)),b=Math.max(1,Math.min(max,Math.round(+$('#b').value)||max));
  if(a>b)[a,b]=[b,a];$('#a').value=a;$('#b').value=b;return{from:a,to:b}}
$('#all').onclick=()=>{const f=cur();if(!f)return;$('#a').value=1;$('#b').value=Math.max(1,f.pages)};
$('#a').onchange=$('#b').onchange=rng;

async function upload(file){if(!file)return;
  const ex=file.name.split('.').pop().toLowerCase();
  if(!['pdf','ppt','pptx'].includes(ex))return toast(t('badType'),'err');
  if(file.size>300*1024*1024)return toast(t('tooBig'),'err');
  const z=$('#upzone'),lab=$('#upT');z.classList.add('busy');lab.replaceChildren(h('span',{class:'spin'}),' '+t('reading',file.name));
  try{const fd=new FormData();fd.append('file',file);const r=await api('/api/files','POST',fd);
    await loadFiles(r.id);toast(t('uploaded'),'ok');closeDrawer()}
  catch(x){toast(x,'err')}
  finally{z.classList.remove('busy');lab.textContent=t('upload')}}
$('#f').onchange=e=>{upload(e.target.files[0]);e.target.value=''};
const side=$('#side');let dc=0;
side.addEventListener('dragenter',e=>{e.preventDefault();dc++;side.classList.add('dragging')});
side.addEventListener('dragleave',()=>{if(--dc<=0){dc=0;side.classList.remove('dragging')}});
side.addEventListener('dragover',e=>e.preventDefault());
side.addEventListener('drop',e=>{e.preventDefault();dc=0;side.classList.remove('dragging');upload(e.dataTransfer.files[0])});
addEventListener('dragover',e=>e.preventDefault());addEventListener('drop',e=>e.preventDefault());

/* ---------- tutor ---------- */
function drawTutorEmpty(){const c=$('#chat');if(c.querySelector('.mrow'))return;
  c.replaceChildren(h('div',{class:'tuempty'},h('div',{class:'logo'},ic('chat')),h('b',{},t('tuEmpty')),
    h('div',{class:'sugs'},...t('sug').map(s=>h('button',{type:'button',onclick:()=>ask(s)},s)))))}
const toEnd=()=>$('#panels').scrollTo({top:1e7,behavior:'smooth'});
async function ask(text){if(!ready()||S.busyAsk)return;const q=(text??$('#q').value).trim();if(!q)return;$('#q').value='';
  const c=$('#chat');c.querySelector('.tuempty')?.remove();
  c.append(h('div',{class:'mrow me'},h('div',{class:'av'},(S.user?.name||'?').trim().charAt(0).toUpperCase()),h('div',{class:'msg',dir:'auto'},q)));
  const dots=h('div',{class:'msg',dir:'auto'},h('span',{class:'dots'},h('i'),h('i'),h('i')));
  const w=h('div',{class:'mrow ai'},h('div',{class:'av'},ic('spark')),dots);c.append(w);toEnd();
  S.busyAsk=true;$('#bask').disabled=true;
  try{const r=await api(`/api/files/${S.fid}/ask`,'POST',{q});dots.replaceChildren(rich(r.answer))}
  catch(x){w.replaceWith(fail(x))}
  finally{S.busyAsk=false;$('#bask').disabled=false;toEnd();$('#q').focus({preventScroll:true})}}
$('#bask').onclick=()=>ask();

$('#bqz').onclick=function(){if(!ready())return;
  run('#o-qz',t('qzBusy'),async()=>{S.quiz=await api(`/api/files/${S.fid}/quiz`,'POST',{n:+$('#qn').value});drawQuiz()},this)};
const LET='ABCDEFGH';
function drawQuiz(){const qs=S.quiz.questions;if(!qs.length)return put('#o-qz',fail(t('qzNone')));
  const bar=h('div',{class:'qbar',id:'qbar'},h('div',{class:'pw'},h('span',{id:'pc'}),h('div',{class:'prog'},h('i',{id:'pg'}))),
    h('button',{id:'bsub',type:'button',onclick:submitQuiz},ic('check'),t('submit')));
  put('#o-qz',h('div',{id:'sc'}),...qs.map((q,i)=>h('div',{class:'q',dir:'auto',style:`animation-delay:${Math.min(i,8)*40}ms`},
    h('h4',{},h('span',{class:'n'},i+1),h('span',{},q.questionText)),
    ...q.options.map((o,k)=>{const r=h('input',{type:'radio',name:'q'+i});r.dataset.v=o;
      return h('label',{class:'opt'},r,h('span',{class:'k'},LET[k]||k+1),h('span',{dir:'auto'},o))}),
    h('div',{class:'why',id:'why'+i}))),bar);
  $('#o-qz').onchange=updatePc;updatePc()}
function answers(){return S.quiz.questions.map((_,i)=>document.querySelector(`input[name=q${i}]:checked`)?.dataset.v||null)}
function updatePc(){if(!S.quiz||!$('#pc'))return;const n=S.quiz.questions.length,a=answers().filter(Boolean).length;
  $('#pc').textContent=t('answered',a,n);$('#pg').style.width=(n?a/n*100:0)+'%'}
async function submitQuiz(){const ans=answers(),b=$('#bsub');b.disabled=true;
  try{const r=await api(`/api/quizzes/${S.quiz.id}/submit`,'POST',{answers:ans});
    r.review.forEach((v,i)=>{$$(`input[name=q${i}]`).forEach(inp=>{const l=inp.closest('label');inp.disabled=true;l.classList.add('lock');
      if(inp.dataset.v===v.correct)l.classList.add('right');else if(inp.checked)l.classList.add('wrong')});
      $('#why'+i).textContent=(v.ok?t('correct'):t('correctAns')+v.correct+'. ')+(v.explanation||'')});
    const pct=r.total?Math.round(r.score/r.total*100):0;
    const svg=document.createElementNS(SVGNS,'svg');svg.setAttribute('viewBox','0 0 80 80');
    const mk=c=>{const e=document.createElementNS(SVGNS,'circle');e.setAttribute('class',c);e.setAttribute('cx',40);e.setAttribute('cy',40);e.setAttribute('r',34);return e};
    const fg=mk('fg');svg.append(mk('bg'),fg);
    put('#sc',h('div',{class:'result'},h('div',{class:'ring'},svg,h('b',{},pct+'%')),
      h('div',{class:'rt'},h('b',{},t('score')+': '+r.score+' / '+r.total),h('span',{},t(pct>=80?'g1':pct>=50?'g2':'g3'))),
      h('button',{type:'button',onclick:()=>$('#bqz').click()},ic('refresh'),t('newQuiz'))));
    requestAnimationFrame(()=>requestAnimationFrame(()=>fg.style.strokeDashoffset=213.6*(1-pct/100)));
    $('#qbar').classList.add('hide');$('#panels').scrollTo({top:0,behavior:'smooth'})}
  catch(x){b.disabled=false;toast(x,'err')}}

async function loadExams(){if(!S.user||S.user.role!=='instructor')return;
  try{S.exams=await api('/api/exams');drawExamList()}catch{}}
function drawExamList(){const L_=S.exams||[];
  if(!L_.length)return put('#o-exlist');
  put('#o-exlist',h('div',{class:'sect'},t('myExams')),...L_.map(e=>h('div',{class:'exrow'},
    h('div',{class:'tx'},h('b',{dir:'auto'},e.title||'Exam'),h('small',{},e.createdAt+' · '+t('exCount',e.questions)+(e.published?' · '+t('attemptsN',e.attempts):''))),

    h('button',{class:'ghost',type:'button',onclick:()=>openExam(e.id)},t('open')))))}
async function openExam(id){try{S.exam=await api('/api/exams/'+id);drawExam();$('#o-ex').scrollIntoView({behavior:'smooth',block:'start'})}catch(x){toast(x,'err')}}
function drawExam(){const E=S.exam;if(!E)return put('#o-ex');const qs=E.questions;
  if(!qs.length&&!E.published)return put('#o-ex',note(t('exNone')));
  const head=h('div',{class:'exhead'},h('div',{class:'l'},h('b',{dir:'auto'},E.title||''),h('span',{class:'badge'},t('exCount',qs.length))));
  if(!E.published){const pb=h('button',{type:'button'},ic('key'),h('span',{},t('publish')));pb.onclick=()=>publishExam(pb);head.append(pb)}
  const parts=[head];
  if(E.published){
    const cp=copyBtn(()=>E.code);
    parts.push(h('div',{class:'pubbox'},h('div',{class:'code'},E.code),h('div',{class:'tx'},h('b',{},t('pubTitle')),t('shareCode')),cp),
      h('p',{class:'hint mut',style:'margin:12px 0 0;font-size:13px'},t('locked')),
      h('div',{class:'sect'},t('results')),h('div',{id:'o-res'}))}
  parts.push(...qs.map((q,i)=>examCard(q,i,E.published)));
  put('#o-ex',...parts);
  if(E.published)loadResults()}
function publishExam(btn){
  const dirty=$$('#o-ex textarea').some((ta,i)=>ta.value!==S.exam.questions[i].questionText);
  if(dirty)return toast(t('saveFirst'),'err');
  if(!btn.dataset.sure){btn.dataset.sure=1;btn.lastChild.textContent=t('confirmPub');
    setTimeout(()=>{if(btn.isConnected){delete btn.dataset.sure;btn.lastChild.textContent=t('publish')}},4000);return}
  btn.disabled=true;
  api(`/api/exams/${S.exam.id}/publish`,'POST').then(r=>{S.exam.published=true;S.exam.code=r.code;drawExam();loadExams();toast(t('published'),'ok')})
   .catch(x=>{toast(x,'err');btn.disabled=false})}
async function loadResults(){const box=$('#o-res');if(!box)return;put('#o-res',skel(t('loading')));
  try{const r=await api(`/api/exams/${S.exam.id}/results`);drawResults(r)}catch(x){put('#o-res',fail(x))}}
function drawResults(r){const at=r.attempts;
  const rf=h('button',{class:'ghost',type:'button',onclick:loadResults},ic('refresh'),t('refresh'));
  if(!at.length)return put('#o-res',note(t('noAttempts')),h('div',{style:'margin-top:10px'},rf));
  const avg=Math.round(at.reduce((a,x)=>a+(x.total?x.score/x.total:0),0)/at.length*100);
  put('#o-res',h('div',{class:'out'},h('div',{class:'oh'},h('b',{},t('avg',at.length,avg)),rf),
    h('div',{class:'tblw'},h('table',{class:'tbl'},
      h('thead',{},h('tr',{},...['colName','colEmail','colScore','colTime'].map(k=>h('th',{},t(k))))),
      h('tbody',{},...at.map(x=>{const p=x.total?Math.round(x.score/x.total*100):0;
        return h('tr',{},h('td',{dir:'auto'},x.name),h('td',{dir:'ltr'},x.email),
          h('td',{},x.score+' / '+x.total+'  ',h('span',{class:'pct '+(p>=60?'hi':'lo')},p+'%')),h('td',{},x.submittedAt))}))))))}
function examCard(q,i,locked){
  const opts=h('div',{class:'eopts'},...q.options.map((o,k)=>h('div',{class:'eo'+(o===q.correctAnswer?' ok':''),dir:'auto'},
    h('span',{class:'k'},o===q.correctAnswer?ic('check'):(LET[k]||k+1)),h('span',{},o))));
  const delay=`animation-delay:${Math.min(i,8)*40}ms`;
  if(locked)return h('div',{class:'q',style:delay},h('div',{class:'qh'},h('span',{class:'badge'},'Q'+(i+1))),h('div',{class:'ro',dir:'auto'},q.questionText),opts);
  const ta=h('textarea',{rows:'3',dir:'auto','aria-label':'Question '+(i+1)});ta.value=q.questionText;
  const save=h('button',{class:'ghost',type:'button',disabled:true},ic('save'),t('saveEdit'));
  ta.oninput=()=>{save.disabled=ta.value===q.questionText};
  save.onclick=async()=>{save.disabled=true;
    try{await api(`/api/exams/${S.exam.id}/questions/${i}`,'PUT',{text:ta.value});q.questionText=ta.value;toast(t('saved'),'ok')}
    catch(x){toast(x,'err');save.disabled=false}};
  const del=h('button',{class:'ghost danger',type:'button'},ic('trash'),t('del'));
  del.onclick=async()=>{$$('#o-ex button').forEach(b=>b.disabled=true);
    try{await api(`/api/exams/${S.exam.id}/questions/${i}`,'DELETE');S.exam.questions.splice(i,1);drawExam();loadExams();toast(t('deleted'),'ok')}
    catch(x){toast(x,'err');$$('#o-ex button').forEach(b=>b.disabled=false);save.disabled=ta.value===q.questionText}};
  return h('div',{class:'q',style:delay},h('div',{class:'qh'},h('span',{class:'badge'},'Q'+(i+1))),ta,opts,h('div',{class:'row'},save,del))}

/* ---------- take a published exam (student) ---------- */
$('#code').oninput=e=>{e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'')};
$('#code').onkeydown=e=>{if(e.key==='Enter')$('#bjoin').click()};
$('#bjoin').onclick=function(){const code=$('#code').value.trim().toUpperCase();if(!code)return toast(t('codeNeed'),'err');
  run('#o-te',t('joinBusy'),async()=>{const r=await api('/api/published/join','POST',{code});S.take={code,title:r.title,questions:r.questions};drawTake()},this)};
function drawTake(){const T_=S.take,qs=T_.questions;if(!qs.length)return put('#o-te',fail(t('qzNone')));
  const bar=h('div',{class:'qbar',id:'xbar'},h('div',{class:'pw'},h('span',{id:'xpc'}),h('div',{class:'prog'},h('i',{id:'xpg'}))),
    h('button',{id:'xsub',type:'button',onclick:submitTake},ic('check'),h('span',{},t('submit'))));
  put('#o-te',h('div',{id:'xsc'}),h('div',{class:'exhead'},h('div',{class:'l'},h('b',{dir:'auto'},T_.title||t('tTe')),h('span',{class:'badge'},t('exCount',qs.length)))),
    ...qs.map((q,i)=>h('div',{class:'q',dir:'auto',style:`animation-delay:${Math.min(i,8)*40}ms`},
      h('h4',{},h('span',{class:'n'},i+1),h('span',{},q.questionText)),
      ...q.options.map((o,k)=>{const r=h('input',{type:'radio',name:'x'+i});r.dataset.v=o;
        return h('label',{class:'opt'},r,h('span',{class:'k'},LET[k]||k+1),h('span',{dir:'auto'},o))}),
      h('div',{class:'why',id:'xwhy'+i}))),bar);
  $('#o-te').onchange=updateTake;updateTake()}
const takeAnswers=()=>S.take.questions.map((_,i)=>document.querySelector(`input[name=x${i}]:checked`)?.dataset.v||null);
function updateTake(){if(!S.take||!$('#xpc'))return;const n=S.take.questions.length,a=takeAnswers().filter(Boolean).length;
  $('#xpc').textContent=t('answered',a,n);$('#xpg').style.width=(n?a/n*100:0)+'%';
  const b=$('#xsub');if(b&&b.dataset.sure&&a===n){delete b.dataset.sure;b.lastChild.textContent=t('submit')}}
async function submitTake(){const ans=takeAnswers(),miss=ans.filter(a=>!a).length,b=$('#xsub');
  if(miss&&!b.dataset.sure){b.dataset.sure=1;b.lastChild.textContent=t('submitAnyway',miss);return toast(t('unanswered',miss))}
  b.disabled=true;
  try{const r=await api(`/api/published/${S.take.code}/submit`,'POST',{answers:ans});
    r.review.forEach((v,i)=>{$$(`input[name=x${i}]`).forEach(inp=>{const l=inp.closest('label');inp.disabled=true;l.classList.add('lock');
      if(inp.dataset.v===v.correct)l.classList.add('right');else if(inp.checked)l.classList.add('wrong')});
      $('#xwhy'+i).textContent=(v.ok?t('correct'):t('correctAns')+v.correct+'. ')+(v.explanation||'')});
    const pct=r.total?Math.round(r.score/r.total*100):0;
    const svg=document.createElementNS(SVGNS,'svg');svg.setAttribute('viewBox','0 0 80 80');
    const mk=c=>{const e=document.createElementNS(SVGNS,'circle');e.setAttribute('class',c);e.setAttribute('cx',40);e.setAttribute('cy',40);e.setAttribute('r',34);return e};
    const fg=mk('fg');svg.append(mk('bg'),fg);
    put('#xsc',h('div',{class:'result'},h('div',{class:'ring'},svg,h('b',{},pct+'%')),
      h('div',{class:'rt'},h('b',{},t('examDone')+' · '+r.score+' / '+r.total),h('span',{},t(pct>=80?'g1':pct>=50?'g2':'g3'))),
      h('button',{type:'button',onclick:()=>{S.take=null;$('#code').value='';put('#o-te');$('#code').focus()}},ic('key'),t('another'))));
    requestAnimationFrame(()=>requestAnimationFrame(()=>fg.style.strokeDashoffset=213.6*(1-pct/100)));
    $('#xbar').classList.add('hide');$('#panels').scrollTo({top:0,behavior:'smooth'});S.take.done=true}
  catch(x){b.disabled=false;toast(x,'err')}}

/* ---------- boot ---------- */
applyTheme();applyLang();
api('/api/me').then(enter).catch(()=>{}).finally(()=>document.body.classList.remove('boot'));
</script></body></html>
