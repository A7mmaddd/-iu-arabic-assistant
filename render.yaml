services:
  - type: web
    name: iu-arabic-assistant
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker on purpose: files, sessions and exams are kept in memory,
    # so every request must reach the same process.
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 300 --bind 0.0.0.0:$PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # Render asks you for the value once, then keeps it
      - key: LLM_MODELS     # tried in this order; a busy model is skipped
        value: gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-3.8-flash
      - key: LLM_THINKING
        value: MINIMAL
      - key: SECRET_KEY
        generateValue: true
      - key: FIREBASE_CREDENTIALS   # whole service-account JSON from Firebase (Project settings -> Service accounts)
        sync: false
      - key: GOOGLE_CLIENT_ID       # OAuth Web client ID; turns on Google sign-in and turns off the demo login
        value: 40606909952-t85saujbh7mh3dkle5onssg52r53jfis.apps.googleusercontent.com
      - key: INSTRUCTOR_EMAILS      # optional, comma list of Google e-mails allowed to register a 6-digit staff number
        sync: false
      - key: ALLOWED_EMAIL_DOMAIN   # optional, e.g. iu.edu.sa; if set, only that domain can sign in
        sync: false
